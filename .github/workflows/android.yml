name: Build QUANTINTEL APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Build diagnostic APK
        run: gradle --no-daemon :diagnostic:assembleDebug
      - name: Verify diagnostic APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose diagnostic/build/outputs/apk/debug/diagnostic-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging diagnostic/build/outputs/apk/debug/diagnostic-debug.apk
      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: APK-install-diagnostic
          path: diagnostic/build/outputs/apk/debug/diagnostic-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Verify APK signature and package
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QUANTINTEL-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
